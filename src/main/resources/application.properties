# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server.port=${PORT:8080}

# ──────────────────────────────────────────
# Database — valores vêm de variáveis de ambiente
# ──────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────
# JPA
# ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ──────────────────────────────────────────
# JWT
# ──────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ──────────────────────────────────────────
# CORS
# ──────────────────────────────────────────
app.frontend.url=${FRONTEND_URL}

# ──────────────────────────────────────────
# Admin (credenciais do usuário admin inicial)
# ──────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ──────────────────────────────────────────
# Cloudinary — imagens em nuvem
# ──────────────────────────────────────────
cloudinary.url=${CLOUDINARY_URL}
# Public ID do logo no Cloudinary (use ":" como separador de pasta, ex: logos:moreira-logo)
cloudinary.logo.public-id=${CLOUDINARY_LOGO_PUBLIC_ID:logos:moreira-logo}

# ──────────────────────────────────────────
# Limite de tamanho de upload
# ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ──────────────────────────────────────────
# E-mail (recuperação de senha) — use variáveis de ambiente no Railway
# ──────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.frontend.url.reset=${FRONTEND_URL}
